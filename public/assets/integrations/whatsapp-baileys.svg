<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <filter id="glow-b" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="2.5" result="b1"/>
      <feGaussianBlur stdDeviation="5" result="b2"/>
      <feMerge>
        <feMergeNode in="b2"/>
        <feMergeNode in="b1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Chat bubble (WhatsApp shape) -->
  <path
    d="M50 10 C27 10 8 27 8 48 C8 57 11 65 17 72 L10 90 L30 82 C36 85 43 87 50 87 C73 87 92 70 92 48 C92 27 73 10 50 10 Z"
