  />

  <!-- Inner arc (WhatsApp circle arc - top) -->
  <path
    d="M28 33 C28 33 34 22 50 22 C62 22 70 29 70 29"
    stroke="#00ff44"
    stroke-width="2.5"
    stroke-linecap="round"
    fill="none"
    filter="url(#glow-b)"
  />

  <!-- Phone handset icon -->
  <path
    d="M38 36 C36 38 34 42 35 46 C36 52 40 58 45 63 C50 68 56 72 62 73 C66 74 70 72 72 70 L68 62 C67 61 65 61 64 62 L60 65 C57 63 54 61 52 58 C49 55 47 52 46 49 L49 45 C50 44 50 42 49 41 Z"
    stroke="#00ff44"
    stroke-width="2.5"
    stroke-linejoin="round"
    stroke-linecap="round"
    fill="none"
    filter="url(#glow-b)"
  />

  <!-- Plus sign (top right) -->
  <line x1="76" y1="18" x2="76" y2="32" stroke="#00ff44" stroke-width="3" stroke-linecap="round" filter="url(#glow-b)"/>
  <line x1="69" y1="25" x2="83" y2="25" stroke="#00ff44" stroke-width="3" stroke-linecap="round" filter="url(#glow-b)"/>
</svg>
