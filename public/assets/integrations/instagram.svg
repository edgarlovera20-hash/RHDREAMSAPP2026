<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <filter id="glow-ig">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <g filter="url(#glow-ig)">
    <!-- Outer rounded square - red/blue gradient neon -->
    <rect x="10" y="10" width="80" height="80" rx="22" stroke="#ff2244" stroke-width="3" fill="none"/>
    <rect x="13" y="13" width="74" height="74" rx="20" stroke="#3344ff" stroke-width="1.5" fill="none" opacity="0.7"/>
    <!-- Camera circle -->
    <circle cx="50" cy="52" r="18" stroke="#cc44cc" stroke-width="2.5" fill="none"/>
    <circle cx="50" cy="52" r="10" stroke="#ff66bb" stroke-width="2" fill="none"/>
    <!-- Dot top right -->
    <circle cx="72" cy="28" r="5" fill="#ff2244" stroke="#ff6677" stroke-width="1.5"/>
    <!-- Viewfinder top bar -->
    <rect x="30" y="22" width="26" height="14" rx="5" stroke="#cc44cc" stroke-width="2" fill="none"/>
  </g>
</svg>
