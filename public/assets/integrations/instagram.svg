<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="ig-grad" x1="0" y1="100" x2="100" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ff3300"/>
      <stop offset="50%" stop-color="#ff44aa"/>
      <stop offset="100%" stop-color="#4466ff"/>
    </linearGradient>
    <filter id="ig-glow" x="-35%" y="-35%" width="170%" height="170%">
      <feGaussianBlur stdDeviation="2.5" result="b1"/>
      <feGaussianBlur stdDeviation="6" result="b2"/>
      <feMerge>
        <feMergeNode in="b2"/>
        <feMergeNode in="b1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Rounded square border -->
  <rect
    x="8" y="8" width="84" height="84" rx="22"
    stroke="url(#ig-grad)"
    stroke-width="3.5"
    fill="none"
    filter="url(#ig-glow)"
  />

  <!-- Camera lens (circle) -->
  <circle
    cx="50" cy="52" r="16"
    stroke="url(#ig-grad)"
    stroke-width="3.5"
    fill="none"
    filter="url(#ig-glow)"
  />

  <!-- Viewfinder dot (top-right inside) -->
  <circle
    cx="70" cy="30" r="4"
    stroke="url(#ig-grad)"
    stroke-width="2.5"
    fill="none"
    filter="url(#ig-glow)"
  />
</svg>
