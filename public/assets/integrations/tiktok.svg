<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <filter id="glow-white" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2" result="b1"/>
      <feGaussianBlur stdDeviation="5" result="b2"/>
      <feMerge>
        <feMergeNode in="b2"/>
        <feMergeNode in="b1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="glow-cyan" x="-35%" y="-35%" width="170%" height="170%">
      <feGaussianBlur stdDeviation="2.5" result="b1"/>
      <feGaussianBlur stdDeviation="6" result="b2"/>
      <feMerge>
        <feMergeNode in="b2"/>
        <feMergeNode in="b1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="glow-red" x="-35%" y="-35%" width="170%" height="170%">
      <feGaussianBlur stdDeviation="2.5" result="b1"/>
      <feGaussianBlur stdDeviation="6" result="b2"/>
      <feMerge>
        <feMergeNode in="b2"/>
        <feMergeNode in="b1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- TikTok musical note shape -->
  <!-- Cyan offset (left shadow) -->
  <path
    d="M55 12 L55 56 C55 64 48 70 40 68 C32 66 28 58 32 51 C36 44 46 44 50 47 L50 36 C38 32 24 40 22 54 C20 68 30 80 44 80 C58 80 68 70 68 56 L68 28 C72 31 78 33 84 33 L84 20 C76 20 70 16 67 12 Z"
    stroke="#00e5ff"
    stroke-width="2"
    stroke-linejoin="round"
    stroke-linecap="round"
    fill="none"
    filter="url(#glow-cyan)"
    transform="translate(-4, 0)"
  />

  <!-- Red offset (right shadow) -->
  <path
    d="M55 12 L55 56 C55 64 48 70 40 68 C32 66 28 58 32 51 C36 44 46 44 50 47 L50 36 C38 32 24 40 22 54 C20 68 30 80 44 80 C58 80 68 70 68 56 L68 28 C72 31 78 33 84 33 L84 20 C76 20 70 16 67 12 Z"
    stroke="#ff2244"
    stroke-width="2"
    stroke-linejoin="round"
    stroke-linecap="round"
    fill="none"
    filter="url(#glow-red)"
    transform="translate(4, 0)"
  />

  <!-- White center (main shape) -->
  <path
    d="M55 12 L55 56 C55 64 48 70 40 68 C32 66 28 58 32 51 C36 44 46 44 50 47 L50 36 C38 32 24 40 22 54 C20 68 30 80 44 80 C58 80 68 70 68 56 L68 28 C72 31 78 33 84 33 L84 20 C76 20 70 16 67 12 Z"
    stroke="white"
    stroke-width="2.5"
    stroke-linejoin="round"
    stroke-linecap="round"
    fill="none"
    filter="url(#glow-white)"
  />
</svg>
