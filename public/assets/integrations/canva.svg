<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="cv-grad" x1="0" y1="0" x2="100" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00e5ff"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#ff44aa"/>
    </linearGradient>
    <filter id="cv-glow" x="-35%" y="-35%" width="170%" height="170%">
      <feGaussianBlur stdDeviation="2.5" result="b1"/>
      <feGaussianBlur stdDeviation="6" result="b2"/>
      <feMerge>
        <feMergeNode in="b2"/>
        <feMergeNode in="b1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Rounded square border -->
  <rect
    x="8" y="8" width="84" height="84" rx="22"
    stroke="url(#cv-grad)"
    stroke-width="3.5"
    fill="none"
    filter="url(#cv-glow)"
  />

  <!-- "C" Canva letter (bold, neon) -->
  <path
    d="M68 34 C62 24 52 18 40 20 C26 23 17 35 19 50 C21 65 34 75 50 73 C61 71 69 64 72 54"
    stroke="url(#cv-grad)"
    stroke-width="8"
    stroke-linecap="round"
    fill="none"
    filter="url(#cv-glow)"
  />

  <!-- Decorative pen/brush tip (Canva brand) -->
  <path
    d="M70 28 L78 20 L82 24 L74 32 Z"
    stroke="url(#cv-grad)"
    stroke-width="2.5"
    stroke-linejoin="round"
    fill="none"
    filter="url(#cv-glow)"
  />
  <line
    x1="74" y1="32" x2="78" y2="38"
    stroke="url(#cv-grad)"
    stroke-width="2.5"
    stroke-linecap="round"
    filter="url(#cv-glow)"
  />
</svg>
