<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="ct-grad" x1="0" y1="0" x2="100" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ff6600"/>
      <stop offset="50%" stop-color="#ff3388"/>
      <stop offset="100%" stop-color="#ff0044"/>
    </linearGradient>
    <filter id="ct-glow" x="-35%" y="-35%" width="170%" height="170%">
      <feGaussianBlur stdDeviation="2.5" result="b1"/>
      <feGaussianBlur stdDeviation="6" result="b2"/>
      <feMerge>
        <feMergeNode in="b2"/>
        <feMergeNode in="b1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Rounded square border (orange/red neon) -->
  <rect
    x="8" y="8" width="84" height="84" rx="22"
    stroke="url(#ct-grad)"
    stroke-width="3.5"
    fill="none"
    filter="url(#ct-glow)"
  />

  <!-- "C" letter (Computrabajo) -->
  <path
    d="M66 32 C60 24 52 20 44 22 C32 25 24 36 26 50 C28 64 40 73 54 71 C62 69 68 63 70 56"
    stroke="url(#ct-grad)"
    stroke-width="7"
    stroke-linecap="round"
    fill="none"
    filter="url(#ct-glow)"
  />

  <!-- Small accent square (top-right, Computrabajo brand mark) -->
  <rect
    x="66" y="16" width="14" height="14" rx="3"
    stroke="url(#ct-grad)"
    stroke-width="2.5"
    fill="none"
    filter="url(#ct-glow)"
  />
</svg>
