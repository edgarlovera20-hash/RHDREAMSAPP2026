<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="indeed-grad" x1="0" y1="0" x2="100" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00aaff"/>
      <stop offset="100%" stop-color="#0055ff"/>
    </linearGradient>
    <filter id="indeed-glow" x="-35%" y="-35%" width="170%" height="170%">
      <feGaussianBlur stdDeviation="2.5" result="b1"/>
      <feGaussianBlur stdDeviation="6" result="b2"/>
      <feMerge>
        <feMergeNode in="b2"/>
        <feMergeNode in="b1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Rounded square border (blue neon) -->
  <rect
    x="8" y="8" width="84" height="84" rx="22"
    stroke="url(#indeed-grad)"
    stroke-width="3.5"
    fill="none"
    filter="url(#indeed-glow)"
  />

  <!-- "i" dot -->
  <circle
    cx="50" cy="25" r="5"
    stroke="url(#indeed-grad)"
    stroke-width="2.5"
    fill="none"
    filter="url(#indeed-glow)"
  />

  <!-- "i" stem -->
  <line
    x1="50" y1="36" x2="50" y2="72"
    stroke="url(#indeed-grad)"
    stroke-width="7"
    stroke-linecap="round"
    filter="url(#indeed-glow)"
  />

  <!-- Indeed arc / swoosh on top-left -->
  <path
    d="M22 32 C22 20 32 12 44 12"
    stroke="url(#indeed-grad)"
    stroke-width="2.5"
    stroke-linecap="round"
    fill="none"
    filter="url(#indeed-glow)"
  />
</svg>
