  <rect x="30" y="4" width="4" height="10" rx="2" fill="#50D0FF"/>
  <!-- Calendar grid dots -->
  <rect x="11" y="27" width="5" height="5" rx="1" fill="#fff"/>
  <rect x="21" y="27" width="5" height="5" rx="1" fill="#fff"/>
  <rect x="31" y="27" width="5" height="5" rx="1" fill="#fff"/>
  <rect x="11" y="36" width="5" height="5" rx="1" fill="#fff" opacity="0.7"/>
  <rect x="21" y="36" width="5" height="5" rx="1" fill="#fff" opacity="0.7"/>
  <rect x="31" y="36" width="5" height="5" rx="1" fill="#fff" opacity="0.7"/>
</svg>
