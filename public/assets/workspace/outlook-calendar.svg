  <rect x="38" y="52" width="12" height="10" rx="2" fill="#0078D4"/>
  <rect x="56" y="52" width="12" height="10" rx="2" fill="#0078D4"/>
  <rect x="74" y="52" width="12" height="10" rx="2" fill="#0078D4"/>
  <rect x="20" y="67" width="12" height="10" rx="2" fill="#0078D4" opacity="0.5"/>
  <rect x="38" y="67" width="12" height="10" rx="2" fill="#0078D4" opacity="0.5"/>
  <rect x="56" y="67" width="12" height="10" rx="2" fill="#0078D4" opacity="0.5"/>
</svg>