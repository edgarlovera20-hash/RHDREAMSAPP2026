<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="oc-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#35B8F1"/>
      <stop offset="100%" stop-color="#0078D4"/>
    </linearGradient>
  </defs>
  <rect width="100" height="100" rx="16" fill="url(#oc-bg)"/>
  <rect x="12" y="22" width="76" height="62" rx="8" fill="#fff"/>
  <rect x="12" y="22" width="76" height="24" rx="8" fill="#0062AD"/>
  <rect x="12" y="36" width="76" height="10" fill="#0062AD"/>
  <!-- Month label -->
  <text x="50" y="34" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-weight="700" font-size="10" fill="#fff">CALENDAR</text>
  <!-- Calendar pins -->
  <rect x="28" y="14" width="8" height="16" rx="4" fill="#50D0FF"/>
  <rect x="64" y="14" width="8" height="16" rx="4" fill="#50D0FF"/>
