<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48">
  <defs>
    <linearGradient id="oc1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#35B8F1"/>
      <stop offset="100%" stop-color="#0078D4"/>
    </linearGradient>
  </defs>
  <!-- Calendar body -->
  <rect x="4" y="8" width="40" height="36" rx="4" fill="url(#oc1)"/>
