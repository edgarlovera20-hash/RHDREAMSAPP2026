<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48">
  <defs>
    <linearGradient id="kg1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FDD835"/>
      <stop offset="100%" stop-color="#FBC02D"/>
    </linearGradient>
  </defs>
  <!-- Document body -->
  <rect x="8" y="3" width="32" height="42" rx="5" fill="url(#kg1)"/>
  <!-- Dark bottom strip -->
  <rect x="8" y="37" width="32" height="8" rx="4" fill="#F57F17"/>
  <!-- Lightbulb circle -->
  <circle cx="24" cy="19" r="8" fill="#fff"/>
  <!-- Bulb base/neck -->
  <rect x="21" y="26" width="6" height="4" rx="1" fill="#fff"/>
  <!-- Horizontal lines inside bulb (filament detail) -->
  <rect x="22" y="28" width="4" height="1" rx="0.5" fill="#FBC02D"/>
  <rect x="22" y="30" width="4" height="1" rx="0.5" fill="#FBC02D"/>
  <!-- Shine dot on bulb -->
  <circle cx="21" cy="16" r="1.5" fill="#FDD835" opacity="0.6"/>
</svg>
