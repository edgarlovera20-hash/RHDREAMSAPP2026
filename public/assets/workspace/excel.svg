<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="xl-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#21A366"/>
      <stop offset="100%" stop-color="#107C41"/>
    </linearGradient>
  </defs>
  <rect width="100" height="100" rx="16" fill="url(#xl-bg)"/>
  <!-- Document base -->
  <rect x="28" y="14" width="50" height="62" rx="4" fill="#fff" opacity="0.95"/>
  <!-- Header bar -->
  <rect x="28" y="14" width="50" height="14" rx="4" fill="#185C37"/>
  <rect x="28" y="20" width="50" height="8" fill="#185C37"/>
  <!-- Grid lines -->
  <line x1="50" y1="28" x2="50" y2="76" stroke="#107C41" stroke-width="1.5"/>
  <line x1="28" y1="44" x2="78" y2="44" stroke="#107C41" stroke-width="1.5"/>
  <line x1="28" y1="57" x2="78" y2="57" stroke="#107C41" stroke-width="1.5"/>
  <!-- X letter -->
  <text x="50" y="42" text-anchor="middle" font-family="Calibri,Arial,sans-serif" font-weight="900" font-size="26" fill="#107C41">X</text>
  <!-- Left green tab -->
  <rect x="14" y="28" width="26" height="48" rx="4" fill="#107C41"/>
  <text x="27" y="57" text-anchor="middle" font-family="Calibri,Arial,sans-serif" font-weight="900" font-size="22" fill="#fff">X</text>
</svg>